# Generated by scripts/adapt_dataset.py from data/raw/external/vopani (city: Delhi).
# Schema mapping: data/processed/vopani_delhi/schema_report.json
project: vopani_delhi-next-day-aqi
seed: 42
data:
  source:
    format: canonical
    path: data/processed/vopani_delhi/canonical.parquet
  cpcb_dir: data/raw/delhi_cpcb
  cams_dir: data/raw/cams
  era5_file: data/raw/era5_delhi_blh.csv
  years:
  - 2015
  - 2019
  timezone: Asia/Kolkata
profiler:
  min_pm25_coverage: 70
  min_years_meeting_coverage: 3
cleaner:
  drop_column_if_missing_over: 60
  short_gap_hours: 6
  daily_min_hours: 16
  pm25_ceiling: 1000
  imputation: station_month_median
features:
  lags:
  - 1
  - 2
  - 3
  - 7
  rolling_windows:
  - 3
  - 7
  groups:
    pollutant_history: true
    station_meteorology: true
    calendar: true
    city_context: true
    era5_blh: true
    cams_forecast: true
  leaky_demo: false
split:
  train:
  - '2015-01-01'
  - '2017-12-31'
  val:
  - '2018-01-01'
  - '2018-12-31'
  test:
  - '2019-01-01'
  - '2019-12-31'
  lockdown:
  - '2020-03-25'
  - '2020-06-30'
trainer:
  models:
  - persistence
  - logreg
  - random_forest
  - lightgbm
  optuna_trials: 15
  class_weight: balanced
loop:
  max_iterations: 4
  min_improvement: 0.01
  primary_metric: macro_f1
llm:
  enabled: true
  model: claude-opus-5-5
  effort: medium
